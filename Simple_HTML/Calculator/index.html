<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="body">
            <div class="casio">casio</div>
            <input type="text" id="screen">
           <div class="button-whole">
            <button class="button" value="7" onclick="btnclick(value)">7</button>
            <button class="button"onclick="btnclick('8')">8</button>
            <button class="button"onclick="btnclick('9')">9</button>
            <button class="button"onclick="btnclick('/')">/</button>
            <br>                
            <button class="button"onclick="btnclick('4')">4</button>
            <button class="button"onclick="btnclick('5')">5</button>
            <button class="button"onclick="btnclick('6')">6</button>
            <button class="button"onclick="btnclick('*')">*</button>
            <br>
            <button class="button"onclick="btnclick('1')">1</button>
            <button class="button"onclick="btnclick('2')">2</button>
            <button class="button"onclick="btnclick('3')">3</button>
            <button class="button"onclick="btnclick('+')">+</button>
            <br>
            <button class="button clear" onclick="clearscreen()">C</button>
            <button class="button"onclick="btnclick('0')">0</button>
            <button class="button" onclick="findResult()">=</button>
            <button class="button"onclick="btnclick('.')">.</button>
           </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
